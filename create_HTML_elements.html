<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        let paragraph = document.createElement("button")
        paragraph.innerHTML = 'Click Me!'  //adding text
        paragraph.style.backgroundColor = 'red'  //chaning style
        paragraph.className = "paragraph"  //adding single class name
        paragraph.classList.add("paragraph-2")  //adding many class names
        paragraph.id = 'para'   //adding id 
        console.log(paragraph)
    </script>
</body>
</html>
